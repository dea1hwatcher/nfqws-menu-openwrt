# =============================================================================
#  general (SIMPLE FAKE ALT).bat  ->  nfqws2
#  Порт стратегии zapret-discord-youtube 1.10.2 (winws1) на nfqws2
#  Блобы взять из bin\ бандла и положить в /etc/nfqws2/blobs/
# =============================================================================

# Provider network interface, e.g. eth3
ISP_INTERFACE="eth3"

# Startup arguments
NFQWS_BASE_ARGS="--lua-init=@/etc/nfqws2/lua/zapret-lib.lua
                 --lua-init=@/etc/nfqws2/lua/zapret-antidpi.lua
                 --lua-init=@/etc/nfqws2/lua/zapret-auto.lua
                 --blob=quic_google:@/etc/nfqws2/blobs/quic_initial_www_google_com.bin
                 --blob=tls_google:@/etc/nfqws2/blobs/tls_clienthello_www_google_com.bin
                 --blob=tls_sferum:@/etc/nfqws2/blobs/tls_clienthello_www_sferum_ru.bin
                 --blob=stun_fake:@/etc/nfqws2/blobs/stun2.bin
                 --blob=discord_udp:@/etc/nfqws2/blobs/quic_initial_steamcommunity_com.bin
                 --blob=game_udp:@/etc/nfqws2/blobs/quic_initial_4pda_to.bin"

# HTTP(S) strategy  <- профиль --filter-tcp=80,443 из .bat
NFQWS_ARGS="--filter-tcp=80,443 --filter-l7=http,tls
            --payload=tls_client_hello
            --lua-desync=fake:blob=stun_fake:repeats=6:tcp_seq=2:tcp_ack=-66000:tcp_ts_up
            --lua-desync=fake:blob=tls_google:repeats=6:tcp_seq=2:tcp_ack=-66000:tcp_ts_up
            --payload=http_req
            --lua-desync=fake:blob=tls_sferum:repeats=6:tcp_seq=2:tcp_ack=-66000:tcp_ts_up"

# QUIC strategy  <- профиль --filter-udp=443 из .bat
NFQWS_ARGS_QUIC="--filter-udp=443 --filter-l7=quic
                 --payload=quic_initial
                 --lua-desync=fake:blob=quic_google:repeats=6"

# UDP strategy  <- профиль Discord voice / STUN из .bat
NFQWS_ARGS_UDP="--filter-udp=19294-19344,50000-50100 --filter-l7=discord,stun
                --payload=discord_ip_discovery,stun
                --lua-desync=fake:blob=discord_udp:repeats=6"

# Working modes
MODE_LIST="--hostlist=/etc/nfqws2/lists/user.list"
MODE_ALL="--hostlist-exclude=/etc/nfqws2/lists/exclude.list"
MODE_AUTO="$MODE_LIST --hostlist-auto=/etc/nfqws2/lists/auto.list --hostlist-auto-debug=/var/log/nfqws2.log $MODE_ALL"
NFQWS_EXTRA_ARGS="$MODE_AUTO"

# IP-lists
NFQWS_ARGS_IPSET="--ipset=/etc/nfqws2/lists/ipset.list --ipset-exclude=/etc/nfqws2/lists/ipset_exclude.list"

# Custom arguments
# Профили из NFQWS_ARGS_CUSTOM встают ПЕРВЫМИ (до UDP/QUIC/HTTPS).
NFQWS_ARGS_CUSTOM="
               --filter-tcp=2053,2083,2087,2096,8443 --filter-l7=tls
               --hostlist-domains=discord.media
               --payload=tls_client_hello
               --lua-desync=fake:blob=tls_google:repeats=6:tcp_seq=2:tcp_ack=-66000:tcp_ts_up
               --new
               --filter-tcp=443 --filter-l7=tls
               --hostlist=/etc/nfqws2/lists/google.list
               --payload=tls_client_hello
               --lua-desync=fake:blob=tls_google:repeats=6:ip_id=zero:tcp_seq=2:tcp_ack=-66000:tcp_ts_up
               "

# --- GAME FILTER (в .bat включается отдельно, по умолчанию выключен) ----------
# Дописать в конец NFQWS_ARGS_CUSTOM через --new. Диапазоны 1024-65535 разбиты,
# чтобы не перехватить порты профилей discord.media / QUIC / Discord-voice.
#
#              --new
#              --filter-tcp=1024-2052,2054-2082,2084-2086,2088-2095,2097-8442,8444-65535
#              --ipset=/etc/nfqws2/lists/ipset.list --ipset-exclude=/etc/nfqws2/lists/ipset_exclude.list
#              --out-range=<n3 --payload=known,unknown
#              --lua-desync=fake:blob=stun_fake:payload=~empty:repeats=6:tcp_seq=2:tcp_ack=-66000:tcp_ts_up
#              --lua-desync=fake:blob=tls_google:payload=~empty:repeats=6:tcp_seq=2:tcp_ack=-66000:tcp_ts_up
#              --lua-desync=fake:blob=tls_sferum:payload=~empty:repeats=6:tcp_seq=2:tcp_ack=-66000:tcp_ts_up
#              --new
#              --filter-udp=1024-19293,19345-49999,50101-65535
#              --ipset=/etc/nfqws2/lists/ipset.list --ipset-exclude=/etc/nfqws2/lists/ipset_exclude.list
#              --out-range=<n2 --payload=known,unknown
#              --lua-desync=fake:blob=game_udp:payload=~empty:repeats=10

# 1.10.1: обновление перенесено из свежего Windows-бандла. В Game Filter
# fake-unknown соответствует NFQWS2-селекции unknown; старый порт уже охватывал
# unknown через --payload=known,unknown + payload=~empty, поэтому лишние дубли не добавлены.

# 1.10.1 SIMPLE FAKE ALT: fake STUN payload обновлён с stun.bin на stun2.bin.

# IPv6 support
IPV6_ENABLED=1

# TCP ports for iptables rules
# .bat: --wf-tcp=80,443,2053,2083,2087,2096,8443[,GameFilterTCP]
# набор расширен до дефолта nfqws2-keenetic (+1984, +5222)
TCP_PORTS=80,443,1984,2053,2083,2087,2096,5222,8443
# с game filter: TCP_PORTS=80,443,1024:65535

# UDP ports for iptables rules
# .bat: --wf-udp=443,19294-19344,50000-50100[,GameFilterUDP]
# набор расширен до дефолта nfqws2-keenetic (STUN 3478:3481,5349; ephemeral 49152:65535)
UDP_PORTS=443,590:600,1400,3478:3481,5349,19294:19344,49152:65535
# с game filter: UDP_PORTS=443,1024:65535

# Keenetic policy name
POLICY_NAME="nfqws"
POLICY_EXCLUDE=0
LOG_LEVEL=0
LOG_DEBUG_PATH="@/var/log/nfqws2-debug.log"
NFQUEUE_NUM=300
USER=nobody
CONFIG_VERSION=1

# ПРИМЕЧАНИЯ ------------------------------------------------------------------
# fooling=badseq в winws1 меняет И seq, И ack: seq += increment,
# ack += -66000 (BADSEQ_ACK_INCREMENT_DEFAULT). Отсюда пара tcp_seq/tcp_ack.
#
# list-google.txt из бандла положить как /etc/nfqws2/lists/google.list
#
# --ip-id=zero (параметр профиля winws1) -> ip_id=zero на каждом инстансе.
#
