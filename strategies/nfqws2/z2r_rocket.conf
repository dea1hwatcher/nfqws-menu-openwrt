# =============================================================================
# z2r_rocket.conf -> nfqws2-android (dea1hwatcher/nfqws2-android)
# Источник: android/main:strategies/z2r_rocket.conf
# Пути $LUA_DIR/$BLOBS_DIR/$LISTS_DIR/$LOG_DIR переведены в /etc/nfqws2/... и
# /opt/var/log; Android-настройки сервиса (APP_MODE/BLOCK_QUIC/NAT_FIX/...) убраны.
# Требуемые доп. файлы: strategies/lua/{custom_funcs.lua,zapret-custom.lua},
# strategies/lists/{ipset_discord.list,ipset_warp.list,ipset_twitter.list}.
# =============================================================================

ISP_INTERFACE="eth3"

NFQWS_BASE_ARGS="--lua-init=@/etc/nfqws2/lua/zapret-lib.lua
                 --lua-init=@/etc/nfqws2/lua/zapret-antidpi.lua
                 --lua-init=@/etc/nfqws2/lua/zapret-custom.lua
                 --lua-gc=60
                 --blob=google_tls:@/etc/nfqws2/blobs/tls_clienthello_www_google_com.bin
                 --blob=tls_max:@/etc/nfqws2/blobs/tls_clienthello_max_ru.bin
                 --blob=quic_google:@/etc/nfqws2/blobs/quic_initial_www_google_com.bin
                 --blob=discord_udp:@/etc/nfqws2/blobs/quic_initial_steamcommunity_com.bin"
NFQWS_ARGS="--filter-tcp=80,443 --filter-l7=http,tls
            --payload=tls_client_hello
            --hostlist-domains=youtube.com,googlevideo.com,google.com,ytimg.com,ggpht.com,googleapis.com
            --out-range=-d10
            --lua-desync=fake:blob=google_tls:repeats=6:fooling=badsum
            --lua-desync=multidisorder:pos=2,5,105,host+5,sld-1,endsld-5,endsld
            --new
            --filter-tcp=80,443 --filter-l7=tls
            --payload=tls_client_hello
            --out-range=-d10
            --lua-desync=fake:blob=tls_max:repeats=6:fooling=badsum
            --lua-desync=multisplit:pos=1:fooling=tcp_seq=1000000
            --new
            --filter-tcp=80 --filter-l7=http
            --payload=http_req
            --out-range=-d10
            --lua-desync=fake:blob=google_tls:repeats=4:fooling=badsum
            --lua-desync=multidisorder:pos=1,midsld"
NFQWS_ARGS_QUIC="--filter-udp=443 --filter-l7=quic
                 --payload=quic_initial
                 --out-range=-d10
                 --lua-desync=fake:blob=quic_google:repeats=3:ipfrag:ipfrag_pos_udp=8
                 --lua-desync=udplen:increment=8:pattern=0xFEA82025"
NFQWS_ARGS_UDP="--filter-udp=3478-3481,19294-19344,50000-65535 --filter-l7=discord,stun
                --payload=discord_ip_discovery,stun
                --out-range=-d10
                --lua-desync=fake:blob=discord_udp:repeats=6"
MODE_LIST="--hostlist=/etc/nfqws2/lists/user.list"
MODE_ALL="--hostlist-exclude=/etc/nfqws2/lists/exclude.list"
MODE_AUTO="$MODE_LIST --hostlist-auto=/etc/nfqws2/lists/auto.list --hostlist-auto-debug=/opt/var/log/auto.log $MODE_ALL"
NFQWS_EXTRA_ARGS="$MODE_AUTO"
NFQWS_ARGS_IPSET="--ipset=/etc/nfqws2/lists/ipset.list --ipset-exclude=/etc/nfqws2/lists/ipset_exclude.list"
NFQWS_ARGS_CUSTOM="--filter-tcp=2053,2083,2087,2096,8443 --filter-l7=tls
                   --out-range=-d10
                   --payload=tls_client_hello
                   --lua-desync=fake:blob=tls_max:repeats=6:fooling=tcp_ts=-600000,badsum
                   --lua-desync=multisplit:pos=1:fooling=tcp_seq=1000000
                   --new
                   --filter-tcp=443 --filter-l7=tls
                   --ipset=/etc/nfqws2/lists/ipset_discord.list
                   --out-range=-d10
                   --payload=tls_client_hello
                   --lua-desync=fake:blob=tls_max:repeats=6:fooling=badsum
                   --lua-desync=multidisorder:pos=1,midsld
                   --new
                   --filter-udp=443,500,1701,2408,4443,4500,8095,8443
                   --ipset=/etc/nfqws2/lists/ipset_warp.list
                   --out-range=-d6
                   --lua-desync=fake:blob=quic_google:payload=all:repeats=1"

IPV6_ENABLED=1
TCP_PORTS=80,443,1984,2053,2083,2087,2096,5222,8443
UDP_PORTS=443,500,590:600,1400,1701,2408,3478:3481,4443,4500,5349,8095,8443,19294:19344,49152:65535

POLICY_NAME="nfqws"
POLICY_EXCLUDE=0
LOG_LEVEL=0
LOG_DEBUG_PATH="@/opt/var/log/nfqws2-debug.log"
NFQUEUE_NUM=300
USER=nobody
CONFIG_VERSION=1
