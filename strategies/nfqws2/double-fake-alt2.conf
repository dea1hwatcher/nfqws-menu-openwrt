# =============================================================================
# general (DOUBLE FAKE ALT2).bat -> NFQWS2 / zapret2-discord-youtube-strats
# fake + multidisorder + multisplit
# Порт: https://github.com/kinlay0/zapret2-discord-youtube-strats (remote `strats`).
# Lua-движок zapret2 у нас идентичен (zapret-lib/antidpi/auto совпадают побайтово),
# поэтому desync-техники и значения tcp_ts перенесены как есть. Переведены имена
# блобов, списки, --wf-tcp/udp -> TCP_PORTS/UDP_PORTS и разбиение .bat-профилей
# по секциям nfqws2.conf.
# Game Filter выключен — его фрагменты в game-profiles/double-fake-alt2.args
# =============================================================================

# Provider network interface
ISP_INTERFACE="eth3"

# Startup arguments
NFQWS_BASE_ARGS="                 --lua-init=@/etc/nfqws2/lua/zapret-lib.lua
                 --lua-init=@/etc/nfqws2/lua/zapret-antidpi.lua
                 --lua-init=@/etc/nfqws2/lua/zapret-auto.lua
                 --blob=quic_initial_4pda_to:@/etc/nfqws2/blobs/quic_initial_4pda_to.bin
                 --blob=quic_initial_steamcommunity_com:@/etc/nfqws2/blobs/quic_initial_steamcommunity_com.bin
                 --blob=quic_initial_www_google_com:@/etc/nfqws2/blobs/quic_initial_www_google_com.bin
                 --blob=stun:@/etc/nfqws2/blobs/stun.bin
                 --blob=tls_clienthello_steam_chat_com_full:@/etc/nfqws2/blobs/tls_clienthello_steam_chat_com_full.bin
                 --blob=tls_clienthello_www_google_com:@/etc/nfqws2/blobs/tls_clienthello_www_google_com.bin"

# HTTP(S) strategy
NFQWS_ARGS="            --filter-tcp=80,443
            --filter-l7=http,tls
            --payload=tls_client_hello
            --lua-desync=fake:blob=stun:repeats=6:tcp_seq=2:tcp_ack=-66000:tcp_ts_up
            --lua-desync=fake:blob=tls_clienthello_steam_chat_com_full:repeats=6:tcp_seq=2:tcp_ack=-66000:tcp_ts_up
            --lua-desync=multisplit:pos=2
            --payload=http_req
            --lua-desync=fake:blob=tls_clienthello_steam_chat_com_full:repeats=6:tcp_seq=2:tcp_ack=-66000:tcp_ts_up
            --lua-desync=multisplit:pos=2"

# QUIC strategy
NFQWS_ARGS_QUIC="                 --filter-udp=443
                 --filter-l7=quic
                 --payload=quic_initial
                 --lua-desync=fake:blob=quic_initial_www_google_com:repeats=6"

# UDP strategy — Discord voice / STUN
NFQWS_ARGS_UDP="                --filter-udp=19294-19344,50000-50100
                --filter-l7=discord,stun
                --payload=discord_ip_discovery,stun
                --lua-desync=fake:blob=quic_initial_steamcommunity_com:repeats=6"

# Working modes
MODE_LIST="--hostlist=/etc/nfqws2/lists/user.list
           --hostlist=/etc/nfqws2/lists/rkn.list
           --hostlist=/etc/nfqws2/lists/user-extra.list
           --hostlist-exclude=/etc/nfqws2/lists/exclude.list
           --hostlist-exclude=/etc/nfqws2/lists/exclude-extra.list
           --ipset-exclude=/etc/nfqws2/lists/ipset_exclude.list
           --ipset-exclude=/etc/nfqws2/lists/ipset_exclude-extra.list"
MODE_ALL="--hostlist-exclude=/etc/nfqws2/lists/exclude.list
          --hostlist-exclude=/etc/nfqws2/lists/exclude-extra.list
          --ipset-exclude=/etc/nfqws2/lists/ipset_exclude.list
          --ipset-exclude=/etc/nfqws2/lists/ipset_exclude-extra.list"
MODE_AUTO="$MODE_LIST --hostlist-auto=/etc/nfqws2/lists/auto.list --hostlist-auto-debug=/opt/var/log/nfqws2.log $MODE_ALL"
NFQWS_EXTRA_ARGS="$MODE_LIST"

# IP-lists
# Точные IP-профили находятся в CUSTOM: у них отдельные порты.
# Автокопирование основной стратегии выключено.
NFQWS_ARGS_IPSET=""

# Custom arguments — служба ставит их раньше UDP / QUIC / HTTPS.
# Discord media, YouTube, IP-профили.
NFQWS_ARGS_CUSTOM="                   --filter-tcp=2053,2083,2087,2096,8443
                   --hostlist-domains=discord.media
                   --payload=tls_client_hello
                   --lua-desync=fake:blob=tls_clienthello_www_google_com:repeats=6:tcp_seq=2:tcp_ack=-66000:tcp_ts_up
                   --new
                   --filter-tcp=443
                   --hostlist=/etc/nfqws2/lists/google.list
                   --payload=tls_client_hello
                   --lua-desync=fake:blob=tls_clienthello_www_google_com:repeats=6:tcp_ts=-600000:ip_id=zero
                   --lua-desync=multidisorder:pos=2,midsld:ip_id=zero
                   --new
                   --filter-udp=443
                   --ipset=/etc/nfqws2/lists/ipset.list
                   --hostlist-exclude=/etc/nfqws2/lists/exclude.list
                   --hostlist-exclude=/etc/nfqws2/lists/exclude-extra.list
                   --ipset-exclude=/etc/nfqws2/lists/ipset_exclude.list
                   --ipset-exclude=/etc/nfqws2/lists/ipset_exclude-extra.list
                   --payload=quic_initial
                   --lua-desync=fake:blob=quic_initial_www_google_com:repeats=6
                   --new
                   --filter-tcp=8443
                   --ipset=/etc/nfqws2/lists/ipset.list
                   --hostlist-exclude=/etc/nfqws2/lists/exclude.list
                   --hostlist-exclude=/etc/nfqws2/lists/exclude-extra.list
                   --ipset-exclude=/etc/nfqws2/lists/ipset_exclude.list
                   --ipset-exclude=/etc/nfqws2/lists/ipset_exclude-extra.list
                   --payload=tls_client_hello
                   --lua-desync=fake:blob=stun:repeats=6:tcp_seq=2:tcp_ack=-66000:tcp_ts_up
                   --lua-desync=fake:blob=tls_clienthello_steam_chat_com_full:repeats=6:tcp_seq=2:tcp_ack=-66000:tcp_ts_up
                   --lua-desync=multisplit:pos=2
                   --payload=http_req
                   --lua-desync=fake:blob=tls_clienthello_steam_chat_com_full:repeats=6:tcp_seq=2:tcp_ack=-66000:tcp_ts_up
                   --lua-desync=multisplit:pos=2
                   --new
                   --hostlist-exclude=/etc/nfqws2/lists/user.list
                   --hostlist-exclude=/etc/nfqws2/lists/user-extra.list
                   --hostlist-exclude=/etc/nfqws2/lists/rkn.list
                   --filter-tcp=80,443
                   --ipset=/etc/nfqws2/lists/ipset.list
                   --hostlist-exclude=/etc/nfqws2/lists/exclude.list
                   --hostlist-exclude=/etc/nfqws2/lists/exclude-extra.list
                   --ipset-exclude=/etc/nfqws2/lists/ipset_exclude.list
                   --ipset-exclude=/etc/nfqws2/lists/ipset_exclude-extra.list
                   --payload=tls_client_hello
                   --lua-desync=fake:blob=stun:repeats=6:tcp_seq=2:tcp_ack=-66000:tcp_ts_up
                   --lua-desync=fake:blob=tls_clienthello_steam_chat_com_full:repeats=6:tcp_seq=2:tcp_ack=-66000:tcp_ts_up
                   --lua-desync=multisplit:pos=2
                   --payload=http_req
                   --lua-desync=fake:blob=tls_clienthello_steam_chat_com_full:repeats=6:tcp_seq=2:tcp_ack=-66000:tcp_ts_up
                   --lua-desync=multisplit:pos=2"

# GAME FILTER выключен. Фрагменты — в game-profiles/double-fake-alt2.args.
# При включении диапазон 1024-65535 ставить ПОСЛЕ основных профилей
# и расширять TCP_PORTS / UDP_PORTS.

# IPv6 support
IPV6_ENABLED=0

# TCP ports for iptables rules
# .bat: --wf-tcp-in=80,443,2053,2083,2087,2096,8443[,GameFilterTCP]
TCP_PORTS=80,443,2053,2083,2087,2096,8443,853
# с game filter: TCP_PORTS=80,443,1024:65535

# UDP ports for iptables rules
# .bat: --wf-udp-in=443,19294-19344,50000-50100[,GameFilterUDP]
UDP_PORTS=443,19294:19344,50000:50100,853
# с game filter: UDP_PORTS=443,1024:65535

# Keenetic policy name
POLICY_NAME="nfqws"
POLICY_EXCLUDE=0
LOG_LEVEL=0
LOG_DEBUG_PATH="@/opt/var/log/nfqws2-debug.log"
NFQUEUE_NUM=300
USER=nobody
CONFIG_VERSION=1
